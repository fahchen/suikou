[tools]
elixir = "1.20.4-otp-29"
erlang = "29.1.1"
bun = "1.3.14"
rust = "1.99.0"

# Install Elixir deps and the frontend's bun deps. Prerequisite of the tasks
# that need a resolved dep tree (dev, cli).
[tasks.setup]
description = "Install Elixir deps and assets (bun)"
run = """
set -eu
mix deps.get
bun --cwd="$PWD/assets" install
"""

# Dev = Phoenix (port 4710) + Vite (port 5173) together, no distribution: the
# agent CLI reaches the server over its loopback HTTP API, same as packaged.
# SUIKOU_DATA_DIR keeps the dev server's CLI credential (cli.json/cli_token) in
# the project's tmp/ instead of the packaged install's data directory. Vite
# proxies /socket + /api to 4710. Ctrl-C stops both.
[tasks.dev]
description = "Dev: Phoenix + Vite"
depends = ["setup"]
env = { SUIKOU_DATA_DIR = "{{config_root}}/tmp/dev-cli" }
run = """
mix phx.server &
phx=$!
bun --cwd="$PWD/assets" run dev &
vite=$!
trap 'kill $phx $vite 2>/dev/null' INT TERM EXIT
wait
"""

# Agent CLI (Elixir, lib/suikou/cli.ex) against the dev server's loopback API:
# it reads the port and token the dev server wrote under SUIKOU_DATA_DIR. Args
# pass through after `--`, e.g. `mise run cli -- review list`.
[tasks.cli]
description = "Agent CLI (Elixir) targeting the dev server"
depends = ["setup"]
env = { SUIKOU_DATA_DIR = "{{config_root}}/tmp/dev-cli" }
run = 'mix run -e "System.halt(Suikou.CLI.run(System.argv))" --'

# Package the whole app into one runnable file: the React frontend (bun runs
# the Vite build), a self-contained `mix release`, and the PBeam runtime,
# joined by `mix pbeam.build`. Host platform only (macOS arm64). The binary
# is xattr-stripped + ad-hoc signed in place; the ad-hoc signature is
# embedded in the Mach-O, so copying it anywhere keeps it valid (no re-sign).
# Defaults to dist/suikou; pass OUT=<path-on-PATH> to build straight onto PATH,
# then restart the daemon (`suikou start --force`).
[tasks.package]
description = "Build the single-file executable (OUT=<path> overrides dist/suikou)"
depends = ["setup"]
run = """
set -eu

if [ -n "${OUT:-}" ]; then out="$OUT"; else out="$PWD/dist/suikou"; fi
mkdir -p "$(dirname "$out")"

echo "==> building frontend"
rm -rf priv/static/assets priv/static/index.html
bun --cwd="$PWD/assets" install --frozen-lockfile
bun --cwd="$PWD/assets" run build

echo "==> building the one-file executable"
MIX_ENV=prod mix pbeam.build --output "$out"

chmod 755 "$out"
# arm64 refuses to exec an unsigned binary (SIGKILL), so ad-hoc sign it after
# clearing quarantine attrs. The JIT entitlements are inert under ad-hoc signing
# but keep it correct if ever hardened-runtime signed + notarized for sharing.
xattr -c "$out"
codesign --force --deep --entitlements packaging/entitlements.plist --sign - "$out"
codesign --verify --verbose "$out"

echo "packaged -> $out"
if [ -z "${OUT:-}" ]; then
  echo "note: cp dist/suikou onto PATH to install (signature survives the copy)"
fi
"""
